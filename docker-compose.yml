version: "3.9"

services:
  radar:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: radar
    ports:
      - "8080:8080"
    environment:
      RADAR_ENV: development
      RADAR_ADDR: ":8080"
      RADAR_LOG_LEVEL: info
      RADAR_RATE_LIMIT: "20"
      RADAR_RATE_BURST: "40"
      # Set agent tokens (comma-separated) to enable auth; leave empty to disable
      RADAR_AGENT_TOKENS: ""
      RADAR_MAX_GREP_FILE_MB: "10"
      RADAR_MAX_GREP_MATCHES: "500"
      RADAR_SANDBOX_TIMEOUT_SEC: "5"
      RADAR_SERVICE_NAME: radar
    healthcheck:
      test: ["CMD", "/app/radar"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
